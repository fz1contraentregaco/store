<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Nostr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/nostr-tools@1.0.0/lib/nostr.bundle.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background-color: white;
        }
        .hidden {
            display: none;
        }
        .nsec {
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <!-- Página de Login -->
    <div id="login-page">
        <div class="container">
            <div class="login-container">
                <h2 class="text-center mb-4">Acceso con Clave Nostr</h2>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="private-key" class="form-label">Clave Privada (nsec)</label>
                        <textarea class="form-control nsec" id="private-key" rows="5" placeholder="Pega tu clave nsec aquí" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                    </div>
                </form>
                <div class="text-center mt-3">
                    <a href="#" id="register-link">Generar nueva clave</a>
                </div>
                <div id="login-error" class="alert alert-danger mt-3 hidden"></div>
            </div>
        </div>
    </div>

    <!-- Página de Registro -->
    <div id="register-page" class="hidden">
        <div class="container">
            <div class="login-container">
                <h2 class="text-center mb-4">Tu Clave Privada Nostr</h2>
                <div class="alert alert-warning mb-3">
                    <strong>¡GUARDA ESTA CLAVE!</strong> Es la única forma de acceder y no podrá recuperarse.
                </div>
                <textarea class="form-control nsec mb-3" id="new-private-key" rows="5" readonly></textarea>
                <div class="d-grid gap-2">
                    <button id="copy-key-btn" class="btn btn-primary">Copiar Clave</button>
                    <button id="back-to-login-btn" class="btn btn-secondary">Volver al Login</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Página Principal -->
    <div id="main-page" class="hidden">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#!">Contenido Protegido</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="#" id="logout-link">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title">Bienvenido</h3>
                            <p class="card-text">Has accedido con éxito usando tu clave Nostr.</p>
                            <button id="show-key-btn" class="btn btn-info">Mostrar mi clave pública</button>
                            <div id="npub-display" class="mt-3 hidden"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Elementos del DOM
        const loginPage = document.getElementById('login-page');
        const registerPage = document.getElementById('register-page');
        const mainPage = document.getElementById('main-page');
        const loginForm = document.getElementById('login-form');
        const privateKeyInput = document.getElementById('private-key');
        const loginError = document.getElementById('login-error');
        const registerLink = document.getElementById('register-link');
        const newPrivateKey = document.getElementById('new-private-key');
        const copyKeyBtn = document.getElementById('copy-key-btn');
        const backToLoginBtn = document.getElementById('back-to-login-btn');
        const logoutLink = document.getElementById('logout-link');
        const showKeyBtn = document.getElementById('show-key-btn');
        const npubDisplay = document.getElementById('npub-display');

        // Datos del usuario
        let currentUser = null;

        // Mostrar página correcta al cargar
        function init() {
            const savedUser = localStorage.getItem('nostrUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                showMainPage();
            } else {
                showLoginPage();
            }
        }

        // Mostrar login
        function showLoginPage() {
            loginPage.classList.remove('hidden');
            registerPage.classList.add('hidden');
            mainPage.classList.add('hidden');
            privateKeyInput.value = '';
        }

        // Mostrar registro
        function showRegisterPage() {
            loginPage.classList.add('hidden');
            registerPage.classList.remove('hidden');
            mainPage.classList.add('hidden');
            
            // Generar nueva clave Nostr
            const sk = nostr.generatePrivateKey();
            const nsec = nostr.nip19.nsecEncode(sk);
            newPrivateKey.value = nsec;
        }

        // Mostrar contenido principal
        function showMainPage() {
            loginPage.classList.add('hidden');
            registerPage.classList.add('hidden');
            mainPage.classList.remove('hidden');
        }

        // Validar clave Nostr
        function validateNsec(nsec) {
            try {
                const { type, data } = nostr.nip19.decode(nsec);
                if (type !== 'nsec') return false;
                
                const pk = nostr.getPublicKey(data);
                return {
                    sk: data,
                    nsec: nsec,
                    npub: nostr.nip19.npubEncode(pk)
                };
            } catch (e) {
                return false;
            }
        }

        // Event listeners
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nsec = privateKeyInput.value.trim();
            
            if (!nsec) {
                showError('Ingresa tu clave nsec');
                return;
            }
            
            const user = validateNsec(nsec);
            if (user) {
                currentUser = user;
                localStorage.setItem('nostrUser', JSON.stringify(user));
                showMainPage();
            } else {
                showError('Clave nsec inválida');
            }
        });

        registerLink.addEventListener('click', (e) => {
            e.preventDefault();
            showRegisterPage();
        });

        copyKeyBtn.addEventListener('click', () => {
            newPrivateKey.select();
            document.execCommand('copy');
            copyKeyBtn.textContent = '¡Copiada!';
            setTimeout(() => copyKeyBtn.textContent = 'Copiar Clave', 2000);
        });

        backToLoginBtn.addEventListener('click', () => {
            showLoginPage();
        });

        logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('nostrUser');
            currentUser = null;
            showLoginPage();
        });

        showKeyBtn.addEventListener('click', () => {
            if (currentUser) {
                npubDisplay.textContent = `Tu clave pública: ${currentUser.npub}`;
                npubDisplay.classList.remove('hidden');
            }
        });

        // Mostrar error
        function showError(msg) {
            loginError.textContent = msg;
            loginError.classList.remove('hidden');
            setTimeout(() => loginError.classList.add('hidden'), 3000);
        }

        // Inicializar
        init();
    </script>
</body>
</html>
