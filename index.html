<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Privado Nostr</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/nostr-tools@1.0.0/lib/nostr.bundle.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 500px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            background-color: white;
        }
        .hidden {
            display: none;
        }
        .nsec {
            word-break: break-all;
            font-family: monospace;
            font-size: 0.9em;
        }
        .alert-fixed {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 300px;
        }
    </style>
</head>
<body>
    <!-- Alertas flotantes -->
    <div id="alert-container" class="alert-fixed"></div>

    <!-- Página de Login -->
    <div id="login-page">
        <div class="container">
            <div class="login-container">
                <h2 class="text-center mb-4">Acceso Privado</h2>
                <p class="text-center text-muted mb-4">Solo para usuarios autorizados</p>
                <form id="login-form">
                    <div class="mb-3">
                        <label for="private-key" class="form-label">Clave Privada (nsec)</label>
                        <textarea class="form-control nsec" id="private-key" rows="5" placeholder="Pega tu clave nsec aquí" required></textarea>
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Verificar Acceso</button>
                    </div>
                </form>
                <div id="login-error" class="alert alert-danger mt-3 hidden"></div>
            </div>
        </div>
    </div>

    <!-- Página Principal -->
    <div id="main-page" class="hidden">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="#!">Contenido Exclusivo</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="#" id="logout-link">Cerrar Sesión</a>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-md-10">
                    <div class="card">
                        <div class="card-header">
                            <h3 class="card-title">Bienvenido usuario autorizado</h3>
                        </div>
                        <div class="card-body">
                            <h4 class="mb-4">Información confidencial</h4>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="card mb-4">
                                        <div class="card-body">
                                            <h5 class="card-title">Documento 1</h5>
                                            <p class="card-text">Contenido exclusivo para miembros autorizados con acceso Nostr.</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="card mb-4">
                                        <div class="card-body">
                                            <h5 class="card-title">Documento 2</h5>
                                            <p class="card-text">Información clasificada disponible solo para tu clave pública.</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-4">
                                <button id="show-npub" class="btn btn-outline-secondary">Mostrar mi identidad Nostr</button>
                                <div id="npub-display" class="mt-3 nsec hidden"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Base de datos de claves autorizadas (en formato nsec)
        const authorizedKeys = {
            "users": [
                {
                    "name": "Usuario VIP 1",
                    "nsec": "nsec1vl029mgpspedva04g90vltkh6fvh240zqtv9k0t9af8935ke9laqsnlfe5",
                    "npub": "npub10elfcs4fr0l0r8af98jlmgdh9c8tcxjvz9qkw038js35mp4dma8qzvjptg",
                    "access": "full"
                },
                {
                    "name": "Usuario Premium",
                    "nsec": "nsec1j4c6y8gt9e3e0k4na2x5k6d9f7g2v3j5h7k8m9n0s1w2e3r4t5y6u7i8o9",
                    "npub": "npub1qny3tkh0acurzla8x3zy4nhrjz5zd8l9sy9jys09umwng00manysew95g8",
                    "access": "premium"
                }
            ]
        };

        // Elementos del DOM
        const loginPage = document.getElementById('login-page');
        const mainPage = document.getElementById('main-page');
        const loginForm = document.getElementById('login-form');
        const privateKeyInput = document.getElementById('private-key');
        const loginError = document.getElementById('login-error');
        const logoutLink = document.getElementById('logout-link');
        const showNpubBtn = document.getElementById('show-npub');
        const npubDisplay = document.getElementById('npub-display');
        const alertContainer = document.getElementById('alert-container');

        // Usuario actual
        let currentUser = null;

        // Mostrar alerta flotante
        function showAlert(message, type = 'success') {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Validar clave Nostr
        function validateNostrKey(nsec) {
            try {
                // Decodificar la clave nsec
                const { type, data } = nostr.nip19.decode(nsec);
                if (type !== 'nsec') return false;
                
                // Obtener la clave pública
                const pk = nostr.getPublicKey(data);
                const npub = nostr.nip19.npubEncode(pk);
                
                // Verificar si está en la lista de autorizados
                const authorizedUser = authorizedKeys.users.find(user => user.nsec === nsec);
                
                if (!authorizedUser) return false;
                
                return {
                    ...authorizedUser,
                    sk: data,
                    pk: pk
                };
            } catch (e) {
                console.error("Error validando clave:", e);
                return false;
            }
        }

        // Mostrar página de login
        function showLoginPage() {
            loginPage.classList.remove('hidden');
            mainPage.classList.add('hidden');
            privateKeyInput.value = '';
        }

        // Mostrar contenido principal
        function showMainPage() {
            loginPage.classList.add('hidden');
            mainPage.classList.remove('hidden');
            showAlert(`Bienvenido ${currentUser.name}`, 'success');
        }

        // Manejar login
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nsec = privateKeyInput.value.trim();
            
            if (!nsec) {
                loginError.textContent = 'Por favor ingresa tu clave privada';
                loginError.classList.remove('hidden');
                return;
            }
            
            const user = validateNostrKey(nsec);
            if (user) {
                currentUser = user;
                localStorage.setItem('currentNostrUser', JSON.stringify(user));
                showMainPage();
            } else {
                loginError.textContent = 'Clave no autorizada o inválida';
                loginError.classList.remove('hidden');
                showAlert('Acceso denegado: clave no autorizada', 'danger');
            }
        });

        // Mostrar npub
        showNpubBtn.addEventListener('click', () => {
            if (currentUser) {
                npubDisplay.textContent = `Tu identidad Nostr: ${currentUser.npub}`;
                npubDisplay.classList.remove('hidden');
            }
        });

        // Logout
        logoutLink.addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('currentNostrUser');
            currentUser = null;
            showLoginPage();
            showAlert('Sesión cerrada correctamente', 'info');
        });

        // Inicializar
        document.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('currentNostrUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    // Verificar que el usuario guardado sigue siendo válido
                    if (authorizedKeys.users.some(u => u.nsec === currentUser.nsec)) {
                        showMainPage();
                        return;
                    }
                } catch (e) {
                    console.error("Error cargando sesión:", e);
                }
            }
            showLoginPage();
        });
    </script>
</body>
</html>
